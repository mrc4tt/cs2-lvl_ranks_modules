"LR_UnusualKills"
{
	// Weapons that never count as an unusual kill, separated by commas, without weapon_
	"ProhibitedWeapons"	"hegrenade,molotov,incgrenade,inferno,decoy,flashbang,smokegrenade,taser"

	// 0 = only count the kills (stats), 1 = also give the experience below
	"Exp_Mode"	"1"

	// Remove a kill type to turn it off. "exp" can be negative.
	"TypeKills"
	{
		"OP"		{ "exp" "1" }	// one shot kill
		"Penetrated"	{ "exp" "1" }	// through a wall
		"NoScope"	{ "exp" "2" }	// sniper without scope
		"Run"		{ "exp" "1"	"min_speed" "200" }	// while running
		"Jump"		{ "exp" "1" }	// while in the air
		"Flash"		{ "exp" "2" }	// while flashed
		"Smoke"		{ "exp" "2" }	// through smoke
		"LastClip"	{ "exp" "1" }	// with the last bullet
		"Distance"	{ "exp" "1"	"min_distance" "1500" }	// from far away
	}
}
